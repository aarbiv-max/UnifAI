description: |
  A multi-agent pipeline that combines document retrieval, Slack context, and Jira tool execution to produce a single smart answer to user questions.

name: |
  Slack, Docs & Jira Search

# ----------------------------
# Providers
# ----------------------------
providers:
  - rid: mcp_server_rid
    name: mcp
    type: mcp_server
    config:
      type: mcp_server
      sse_endpoint: http://10.46.254.131:8007/servers/mcp-atlassian/mcp
      tool_names:
        - jira_get_issue
        - jira_search
        - jira_get_project_issues
        - jira_create_issue
        - jira_update_issue
        - jira_link_to_epic

# ----------------------------
# LLM Definitions
# ----------------------------
llms:
  - rid: openai_llm_rid
    name: openai_llm
    type: openai
    config:
      type: openai
      model_name: claude-sonnet-4-5-20250929
      api_key: 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
      base_url: https://api.anthropic.com/v1/

# ----------------------------
# Retriever
# ----------------------------
retrievers: [ ]


# ----------------------------
# Tool Stubs
# ----------------------------
tools: [ ]

# ----------------------------
# Conditions
# ----------------------------
conditions: [ ]

nodes:
  - rid: user_question_node_rid
    name: User Question Node
    type: user_question_node
    config:
      type: user_question_node

  - rid: final_answer_node_rid
    name: Final Answer None
    type: final_answer_node
    config:
      type: final_answer_node

  - rid: agent_with_jira_rid
    name: Agent With Jira
    type: custom_agent_node
    config:
      type: custom_agent_node
      llm: openai_llm_rid
      system_message: ""


# ----------------------------
# Plan Steps
# ----------------------------
plan:
  - uid: user_input
    node: user_question_node_rid
    meta:
      display_name: User Question
      description: |
        The user inputs a question or request.

  ##### JIRA ######
  - uid: agent_with_jira
    after: user_input
    node: agent_with_jira_rid
    meta:
      display_name: Jira Agent
      description: |
        Get Jira data using JIRA tools

  - uid: finalize
    after: agent_with_jira
    node: final_answer_node_rid
    meta:
      display_name: Final Answer
      description: |
        Provide the final answer to the user based on all gathered information.

