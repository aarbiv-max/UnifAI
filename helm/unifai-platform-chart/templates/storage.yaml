{{- if .Values.storage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifai-dataflow-shared-storage
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "unifai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 100Gi
{{- end }}
