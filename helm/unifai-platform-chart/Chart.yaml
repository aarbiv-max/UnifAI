apiVersion: v2
name: unifai-platform
description: Complete UnifAI Platform - Single Helm Chart
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  # Wave 1: Storage Infrastructure
  - name: unifai-dataflow-shared-storage
    version: "*"
    repository: "file://../shared-resources/unifai-dataflow-shared-storage"
    condition: storage.enabled
    
  # Wave 2: Core Infrastructure Services  
  - name: mongodb
    version: "*"
    repository: "file://../shared-resources/mongodb"
    condition: mongodb.enabled
    
  - name: qdrant
    version: "*" 
    repository: "file://../shared-resources/qdrant"
    condition: qdrant.enabled
    
  - name: rabbitmq
    version: "*"
    repository: "file://../shared-resources/rabbitmq" 
    condition: rabbitmq.enabled
    
  - name: docling
    version: "*"
    repository: "file://../shared-resources/docling"
    condition: docling.enabled
    
  # Wave 3: Platform Services
  - name: shared-config
    version: "*"
    repository: "file://../shared-resources/shared-config"
    condition: sharedConfig.enabled
    
  - name: sso
    version: "*"
    repository: "file://../shared-resources/sso"
    condition: sso.enabled
    
  # Wave 4: Application Services
  - name: unifai-dataflow-server
    version: "*"
    repository: "file://../dataflow/unifai-dataflow-server"
    condition: dataflow.enabled
    
  - name: unifai-dataflow-celery
    version: "*"
    repository: "file://../dataflow/unifai-dataflow-celery"
    condition: dataflow.enabled
    
  - name: unifai-dataflow-config
    version: "*"
    repository: "file://../dataflow/unifai-dataflow-config"
    condition: dataflow.enabled
    
  - name: unifai-multiagent-be
    version: "*"
    repository: "file://../multiagent/be"
    condition: multiagent.enabled
    alias: multiagent-be
    
  - name: multiagent-config
    version: "*"
    repository: "file://../multiagent/multiagent-config"
    condition: multiagent.enabled
    
  # Wave 5: User Interface
  - name: unifai-ui
    version: "*"
    repository: "file://../ui"
    condition: ui.enabled
    alias: ui
