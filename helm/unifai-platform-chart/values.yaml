# Global configuration
global:
  namespace: tag-ai--runtime-int

# Component enablement flags
storage:
  enabled: true

mongodb:
  enabled: true

qdrant:
  enabled: true
  
rabbitmq:
  enabled: true

docling:
  enabled: true
  
sharedConfig:
  enabled: true
  
sso:
  enabled: true

dataflow:
  enabled: true
  
multiagent:
  enabled: true
  
ui:
  enabled: true

# Component Configuration
# These values will be merged with external value files

# Infrastructure Components
mongodb:
  image: mongo:7.0
  auth:
    enabled: true
    username: admin
    password: password
    database: unifai
  persistence:
    size: 20Gi
    storageClass: gp3-csi

qdrant:
  image: qdrant/qdrant:v1.7.4
  persistence:
    size: 10Gi
    storageClass: gp3-csi

rabbitmq:
  image: rabbitmq:3.12-management
  auth:
    username: admin
    password: password
  persistence:
    size: 8Gi
    storageClass: gp3-csi

docling:
  enabled: true
  
# Application Components  
dataflow:
  server:
    image: unifai-dataflow-server
    replicas: 1
  celery:
    image: unifai-dataflow-celery  
    replicas: 1

multiagent:
  backend:
    image: unifai-multiagent-be
    replicas: 1

ui:
  image: unifai-ui
  replicas: 1
  
sso:
  image: unifai-sso
  replicas: 1
