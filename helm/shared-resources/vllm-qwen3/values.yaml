# Default values for vllm-qwen3.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: vllm/vllm-openai
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # Leave empty to use Chart.appVersion, or specify a version like "v0.9.2", "latest", etc.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting pod annotations
podAnnotations: {}

# This is for setting pod labels
podLabels:
  # Add custom labels here, e.g.:
  # app: vllm-gpu
  # tier: inference

# This is for setting Security Context at the pod level more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  # Relaxed for vLLM socket binding requirements
  seccompProfile:
    type: RuntimeDefault

# This is for setting Security Context at the container level more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE  # Allow binding to ports

# This is for setting up the service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# This is for setting up ingress more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
# Note: For OpenShift, use the 'route' section below instead
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# OpenShift Route configuration
route:
  enabled: true
  # If host is empty, OpenShift will auto-generate: <route-name>-<namespace>.<cluster-domain>
  # You can override this by setting a specific hostname
  host: ""
  # Cluster domain - if empty, OpenShift will auto-detect
  # You can set this if you want predictable URLs: "apps.cluster-name.example.com"
  clusterDomain: ""
  path: ""
  annotations:
    haproxy.router.openshift.io/timeout: "300s"
    haproxy.router.openshift.io/balance: "roundrobin"
  tls:
    enabled: false
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# GPU configuration - centralized GPU settings
gpu:
  # Number of GPUs to allocate
  count: 2
  # GPU device IDs to use (will auto-generate if empty)
  deviceIds: []  # e.g., [0, 1] or leave empty for auto: 0,1,2...

# This is for setting up the resource limits and requests more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
resources:
  limits:
    cpu: '8'      # Reduced to comply with namespace CPU limits
    memory: 48Gi  # More memory for faster model loading
    nvidia.com/gpu: 2  # Will be dynamically set from gpu.count
  requests:
    cpu: '4'      # Reduced for namespace compliance
    memory: 12Gi  # More memory for faster startup
    nvidia.com/gpu: 2  # Will be dynamically set from gpu.count

# HuggingFace token secret configuration
huggingFaceSecret:
  # Name of the secret containing HuggingFace token
  name: "huggingface-token-secret"
  # Key within the secret that contains the token
  key: "token"

# vLLM specific configuration
vllm:
  # Model to load - can be HuggingFace model ID or local path
  model: "Qwen/Qwen3-32B-FP8"
  # Maximum model length - adjust based on model capabilities
  maxModelLen: "65536"
  # GPU memory utilization (0.0-1.0) - adjust based on available VRAM
  gpuMemoryUtilization: "0.85"
  # Quantization method - options: none, fp8, int8, etc.
  quantization: "fp8"
  # Note: tensorParallelSize is automatically set from gpu.count
  # Rope scaling configuration - leave empty for auto-detection
  ropeScaling: ""
  # Maximum number of batched tokens
  maxNumBatchedTokens: "32768"
  # Maximum number of sequences in a batch
  maxNumSeqs: "4"
  # Block size for attention computation
  blockSize: "16"
  # Swap space in GiB
  swapSpace: "8"
  # Force eager execution (disable CUDA graphs)
  enforceEager: true
  # Disable request logging for performance
  disableLogRequests: true
  # Enable chunked prefill for better batching
  enableChunkedPrefill: true

# This sets the container port
containerPort: 8000

# Health probe configuration
healthProbes:
  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 120  # Start checking sooner - health endpoint responds before model loads
    periodSeconds: 15         # Check more frequently 
    timeoutSeconds: 10
    successThreshold: 1
    failureThreshold: 40      # Allow more failures (40 * 15s = 10min total patience)
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 300  # 5 minutes - less aggressive
    periodSeconds: 30
    timeoutSeconds: 10
    successThreshold: 1
    failureThreshold: 20      # 20 * 30s = 10min patience

# Environment variables
env:
  # FlashInfer workspace directory
  flashinferWorkspaceDir: "/tmp/flashinfer"
  # Triton cache directory
  tritonCacheDir: "/tmp/.triton"
  # CUDA visible devices - will be auto-generated from gpu configuration
  # Leave empty to auto-generate based on gpu.count and gpu.deviceIds
  cudaVisibleDevices: ""
  # Enable TCP engine for distributed inference
  vllmEngineUseTcp: "1"
  # Disable NCCL P2P for stability
  ncclP2pDisable: "1"
  # Cache directories for models and libraries (persistent storage)
  transformersCache: "/models/.cache"
  home: "/tmp"
  hfHome: "/models/.cache"
  vllmConfigRoot: "/models/.cache"
  vllmCacheRoot: "/models/.cache"
  # CUDA debugging settings
  cudaLaunchBlocking: "0"
  tokenizersParallelism: "true"  # Enable parallel tokenizer loading for faster startup
  # Allow long max model length override
  vllmAllowLongMaxModelLen: "1"
  # Performance optimization flags
  vllmWorkerMultiprocMethod: "spawn"
  vllmEngineIterationTimeoutS: "600"

# This is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Additional volumes and volume mounts
volumes:
  dshm:
    enabled: true
    medium: Memory
    sizeLimit: "16Gi"
  flashinferCache:
    enabled: true
  # Persistent model cache for faster startup times and performance
  modelCache:
    enabled: true
    # Storage class for model cache PVC
    # Based on performance testing, aws-ebs provides best performance for model loading:
    # - aws-ebs: 8,904 MB/s read, 1,519 MB/s write (recommended for single-pod vLLM)
    # - aws-efs-tier-c*: 8,605 MB/s read, 250 MB/s write (use for multi-pod shared data)
    # Leave empty to use cluster default storage class
    storageClass: "aws-ebs"
    size: "100Gi"
    accessMode: "ReadWriteOnce"
    # Force model re-download even if cache exists (useful for model updates)
    forceRedownload: false

# This is for setting node selection more information can be found here: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
nodeSelector: {}

# This is for setting tolerations more information can be found here: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  # GPU tenant tolerations for scheduling on GPU nodes
  - key: tenant
    operator: Equal
    value: rh-jarvis-ai-a100
    effect: NoSchedule
  - key: tenant
    operator: Equal
    value: llmaas-a100
    effect: NoSchedule
  - key: tenant
    operator: Equal
    value: rh-jarvis-ai
    effect: NoSchedule
  - key: tenant
    operator: Equal
    value: llmaas
    effect: NoSchedule

# This is for setting affinity more information can be found here: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

# Namespace configuration
# Note: This should typically be set via --namespace flag or Release.Namespace
# Override only if you need to deploy to a different namespace than the release
namespace: "" 