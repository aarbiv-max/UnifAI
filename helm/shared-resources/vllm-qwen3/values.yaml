# Optimized values for vLLM Qwen3-32B-FP8 - Performance Optimized Configuration
# This configuration prioritizes model loading speed and performance optimization

replicaCount: 1

image:
  repository: vllm/vllm-openai
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podLabels:
  paas.redhat.com/appcode: "TAG-001"

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# OpenShift Route configuration
route:
  enabled: true
  host: ""
  clusterDomain: ""
  path: ""
  annotations:
    haproxy.router.openshift.io/timeout: "300s"
    haproxy.router.openshift.io/balance: "roundrobin"
  tls:
    enabled: false
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# GPU configuration - using 2 GPUs for tensor parallelism
gpu:
  count: 2
  deviceIds: []

# Resources - increased for stability with 2 GPUs
resources:
  limits:
    cpu: '8'
    memory: 48Gi
    nvidia.com/gpu: 2
  requests:
    cpu: '4'
    memory: 24Gi
    nvidia.com/gpu: 2

# HuggingFace token secret configuration
huggingFaceSecret:
  name: "huggingface-token-secret"
  key: "token"

# vLLM configuration
vllm:
  model: "Qwen/Qwen3-32B-FP8"
  localModelPath: "/models/Qwen3-32B-FP8"
  maxModelLen: "90000"
  gpuMemoryUtilization: "0.90"
  quantization: "fp8"

containerPort: 8000

# Health probes - adjusted for faster loading
healthProbes:
  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 240
    periodSeconds: 20
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 15

# Environment variables - optimized for 2-GPU setup
env:
  home: "/tmp"
  hfHome: "/models/.cache"
  # Disable torch compilation to prevent CUDA issues
  torchCompileDisable: "1"
  # NCCL settings for 2-GPU tensor parallelism
  ncclDebug: "INFO"
  ncclP2pLevel: "LOC"
  ncclSocketIfinclue: "^docker,lo"
  # Ray settings for distributed processing
  vllmRayStartUpTimeoutS: "900"
  vllmWorkerUseRay: "0"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

volumes:
  dshm:
    enabled: true
    medium: Memory
    sizeLimit: "16Gi"
  modelCache:
    enabled: true
    storageClass: "aws-ebs"
    size: "50Gi"
    accessMode: "ReadWriteOnce"

nodeSelector: {}

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: tenant
    operator: Equal
    value: rh-jarvis-ai-a100
    effect: NoSchedule
  - key: tenant
    operator: Equal
    value: llmaas-a100
    effect: NoSchedule
  - key: tenant
    operator: Equal
    value: rh-jarvis-ai
    effect: NoSchedule
  - key: tenant
    operator: Equal
    value: llmaas
    effect: NoSchedule

affinity: {}

labels:
  paas.redhat.com/appcode: "TAG-001"

namespace: "" 