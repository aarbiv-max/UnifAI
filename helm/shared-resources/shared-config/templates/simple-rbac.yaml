# Simplified RBAC for debugging
{{- if .Values.serviceDiscovery.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-config-simple-role
  namespace: {{ .Release.Namespace }}
  labels:
    app: shared-config
    component: service-discovery
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-config-simple-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app: shared-config
    component: service-discovery
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
- kind: ServiceAccount
  name: shared-config-discovery-simple
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: shared-config-simple-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
