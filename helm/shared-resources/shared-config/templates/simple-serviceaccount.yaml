# Simplified ServiceAccount for debugging
{{- if .Values.serviceDiscovery.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shared-config-discovery-simple
  namespace: {{ .Release.Namespace }}
  labels:
    app: shared-config
    component: service-discovery
  annotations:
    argocd.argoproj.io/sync-wave: "3"
{{- end }}
