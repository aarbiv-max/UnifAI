{{- if .Values.reports.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unifai-tests.fullname" . }}-reports
  labels:
    {{- include "unifai-tests.reportLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "unifai-tests.reportSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "unifai-tests.reportLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: "{{ .Values.reports.viewer.image.repository }}:{{ .Values.reports.viewer.image.tag }}"
          imagePullPolicy: {{ .Values.reports.viewer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- with .Values.reports.viewer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: reports
              mountPath: /opt/app-root/src
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: {{ include "unifai-tests.reportsPvcName" . }}
{{- end }}
