multiagent_server:
  replicaCount: 2
  resources: 
    limits:
      cpu: '4'
      memory: '8Gi'
    requests:
      cpu: '4'
      memory: '8Gi'
  image: 
    repository: images.paas.redhat.com/unifai/multiagent
    tag: "latest"
  service:
    type: ClusterIP
    port: "8003"
  env:
    BACKEND_ENV: "production" #options - production development
    ROLE: "flask" # options are flask celery debug
    GUNICORN_WORKERS: "9"
    GUNICORN_THREADS: "8"
    GUNICORN_TIMEOUT: "600"
    VERSION: ""
    
    # Redis Configuration (for session streaming)
    REDIS_IP: "redis-master"
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    REDIS_PASSWORD: ""
    REDIS_STREAM_MAXLEN: "5000"
    REDIS_STREAM_TTL_SECONDS: "3600"