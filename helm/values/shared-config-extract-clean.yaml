# Clean shared-config values - sensitive data externalized
# Credentials and site-specific data come from private repo

serviceDiscovery:
  enabled: true
  
  # Container image for service discovery job
  image:
    # Registry comes from site-config.yaml in private repo
    repository: bitnami/kubectl
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # Services to discover - matches services deployed in waves 1-2
  services:
    mongodb:
      serviceName: "mongodb"
      enabled: true
    rabbitmq:
      serviceName: "rabbitmq"
      enabled: true
    qdrant:
      serviceName: "qdrant"
      enabled: true
    docling:
      serviceName: "docling-serve"
      enabled: true

  # Job configuration
  job:
    restartPolicy: OnFailure
    backoffLimit: 3
    ttlSecondsAfterFinished: 300  # Clean up job after 5 minutes
    
  # RBAC - namespace-scoped permissions (no cluster-admin required)
  rbac:
    create: true
    serviceAccount:
      create: true
      name: "shared-config-discovery"
    
  # ConfigMap name to create with discovered service info
  configMapName: "shared-config"
  
  # Wait timeout (in seconds) for services to be ready  
  waitTimeout: 600

# Additional fields - values come from site-config.yaml
# fullnameOverride: set from private config
# global.syncWave: set from private config

# Note: Service discovery will read actual credentials from 
# Kubernetes secrets created by each service, not from static config
