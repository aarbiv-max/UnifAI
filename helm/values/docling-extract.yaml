# Docling Configuration for ArgoCD
# 
# ⚠️  IMPORTANT: This file is derived from shared-resource-values.yaml docling section
# 🔗  Source: shared-resource-values.yaml > docling: {...}
# 🔄  To sync: Copy values from shared-resource-values.yaml docling section (converted to root level)
#
# This file contains values from shared-resource-values.yaml docling section converted to root level

# === FROM shared-resource-values.yaml docling section ===
service:
  type: LoadBalancer
  port: 5001

resources:
  limits:
    cpu: 4
    memory: 8Gi
  requests:
    cpu: 2
    memory: 4Gi

# === ADDITIONAL FIELDS REQUIRED BY DOCLING CHART ===
fullnameOverride: "docling-serve"

# Storage configuration (consistent with chart defaults)
storage:
  volumeName: "unifai-docling-volume"
  requestedSize: 20Gi
  className: aws-ebs  # Match chart default
  accessModes:
    - ReadWriteOnce  # Match chart default
  keepPvc: true
  annotations:
    kubernetes.io/reclaimPolicy: Delete
  labels:
    paas.redhat.com/appcode: TAG-001
