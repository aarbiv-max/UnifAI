# Shared Config Service Discovery Configuration for ArgoCD
# 
# ⚠️  IMPORTANT: This file contains service discovery configuration for shared-config chart
# 🔗  Source: Custom configuration for GitOps service discovery implementation
# 🔄  Purpose: Discovers and creates ConfigMap with all service endpoints after deployment
#
# This file contains:
# 1. Service discovery job configuration  
# 2. RBAC settings for namespace-scoped permissions
# 3. Service endpoint discovery settings
# 4. RabbitMQ credential discovery from secrets

# === SERVICE DISCOVERY CONFIGURATION ===
serviceDiscovery:
  enabled: true
  
  # Container image for service discovery job
  image:
    repository: bitnami/kubectl
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # Services to discover - matches services deployed in waves 1-2
  services:
    mongodb:
      serviceName: "mongodb"
      enabled: true
    rabbitmq:
      serviceName: "rabbitmq"
      enabled: true
    qdrant:
      serviceName: "qdrant"
      enabled: true
    docling:
      serviceName: "docling-serve"
      enabled: true

  # Job configuration
  job:
    restartPolicy: OnFailure
    backoffLimit: 3
    ttlSecondsAfterFinished: 300  # Clean up job after 5 minutes
    
  # RBAC - namespace-scoped permissions (no cluster-admin required)
  rbac:
    create: true
    serviceAccount:
      create: true
      name: "shared-config-discovery"
    
  # ConfigMap name to create with discovered service info
  configMapName: "shared-config"
  
  # Wait timeout (in seconds) for services to be ready  
  waitTimeout: 600

# === ADDITIONAL FIELDS REQUIRED BY SHARED-CONFIG CHART ===
fullnameOverride: "unifai-shared-config"

# Global sync wave (overridden by GitOps parameters)
global:
  syncWave: "3"
