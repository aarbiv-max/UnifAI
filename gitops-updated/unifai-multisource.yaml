---
# Multi-source ArgoCD Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unifai-platform
  namespace: tag-ai--runtime-int
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: unifai-platform
    app.kubernetes.io/component: platform
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Multi-source configuration - pulls from both repos
  sources:
    # Source 1: Private configuration repo (loaded first)  
    - repoURL: https://gitlab.cee.redhat.com/gzhou/unifai-gitops-priv.git
      targetRevision: HEAD
      ref: values  # This allows other sources to reference files as $values/path/filename.yaml
      
    # Source 2: Main code repo with all the helm charts
    
    # Wave 1: Storage - Deploy first  
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai  # Current branch
      path: helm/shared-resources/unifai-dataflow-shared-storage
      helm:
        valueFiles:
          - $values/environments/dev/sensitive-values.yaml       # From private repo
          - $values/environments/dev/site-config.yaml            # From private repo  
          - ../../values/shared-resource-values.yaml  # From main repo
          - ../../values/global-config-clean.yaml     # Cleaned version
        parameters:
          - name: "global.syncWave"
            value: "1"
          - name: "fullnameOverride"
            value: "unifai-dataflow-shared-storage"
    
    # Wave 2: Core Services - Deploy in parallel
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai
      path: helm/shared-resources/mongodb
      helm:
        valueFiles:
          - $values/environments/dev/sensitive-values.yaml       # Passwords, etc.
          - $values/environments/dev/site-config.yaml            # Resources, infrastructure
          - ../../values/mongodb-extract-clean.yaml  # Clean template
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai
      path: helm/shared-resources/qdrant
      helm:
        valueFiles:
          - $values/environments/dev/sensitive-values.yaml
          - $values/environments/dev/site-config.yaml
          - ../../values/qdrant-extract-clean.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai
      path: helm/shared-resources/rabbitmq
      helm:
        valueFiles:
          - $values/environments/dev/sensitive-values.yaml
          - $values/environments/dev/site-config.yaml
          - ../../values/rabbitmq-extract-clean.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
          - name: "auth.existingPasswordSecret"
            value: "rabbitmq-static-creds"
          - name: "auth.existingSecretPasswordKey" 
            value: "rabbitmq-password"
          - name: "auth.existingErlangSecret"
            value: "rabbitmq-static-creds"
          - name: "auth.existingSecretErlangKey"
            value: "rabbitmq-erlang-cookie"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai
      path: helm/shared-resources/docling
      helm:
        valueFiles:
          - $values/environments/dev/sensitive-values.yaml
          - $values/environments/dev/site-config.yaml
          - ../../values/docling-extract-clean.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    # Wave 3: Shared Infrastructure Configuration
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai
      path: helm/shared-resources/shared-config
      helm:
        valueFiles:
          - ../../values/shared-config-extract-clean.yaml
        parameters:
          - name: "global.syncWave"
            value: "3"
    
    # Wave 4: Application Layer - Deploy after infrastructure is ready
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai
      path: helm/dataflow/unifai-dataflow-server
      helm:
        valueFiles:
          - $values/environments/dev/sensitive-values.yaml
          - $values/environments/dev/site-config.yaml
          - ../../values/dataflow-resource-values-clean.yaml
        parameters:
          - name: "global.syncWave"
            value: "4"
          - name: "image.tag"
            value: "2025.09.25.1425"  # Working dataflow backend image tag
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai
      path: helm/dataflow/unifai-dataflow-celery  
      helm:
        valueFiles:
          - $values/environments/dev/sensitive-values.yaml
          - $values/environments/dev/site-config.yaml
          - ../../values/dataflow-resource-values-clean.yaml
        parameters:
          - name: "global.syncWave"
            value: "4"
          - name: "image.tag"
            value: "2025.09.25.1425"  # Working dataflow celery image tag
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai
      path: helm/shared-resources/sso
      helm:
        valueFiles:
          - $values/environments/dev/sensitive-values.yaml       # SSO secrets
          - $values/environments/dev/site-config.yaml
          - ../../values/sso-values-clean.yaml
        parameters:
          - name: "global.syncWave"
            value: "4"
          - name: "backend.image.tag"
            value: "2025.09.25.1425"  # Working SSO backend image tag

  destination:
    server: https://kubernetes.default.svc
    namespace: tag-ai--runtime-int  # Current development namespace

  syncPolicy:
    automated:
      prune: false  # Don't auto-delete resources  
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
  - group: ""
    kind: PersistentVolumeClaim
    jsonPointers:
    - /spec/resources/requests/storage
    - /metadata/finalizers
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/replicas
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
