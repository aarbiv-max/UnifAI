[mongodb]
url = mongodb://${MONGODB_HOST}:%(mongo_port)s
backend_collection = be
mongo_port = 27017
dot_identifier = [dot]
size_limitation = 1000

[development]
hostname = 0.0.0.0
asc_port = 1235
agents_port = 8760
backend_port = 13456

[network]
vlan_test_capture_time = 20

[production]
hostname = 0.0.0.0
asc_port = 11235
agents_port = 11234
backend_port = 8080

[production1]
hostname = 0.0.0.0
asc_port = $ASC_PORT #11235
agents_port = $AGENTS_PORT
backend_port = $BE_PORT
lucid_ui_port = $UI_PORT

[rabbitmq]
rmq_host = $RABBITMQ_HOST
rmq_port = 5672
rmq_username = $rmq_username
rmq_password = $rmq_password

[dpr]
preprod_cluster = $preprod_cluster
preprod_access_token = $preprod_access_token
prod_cluster = $prod_cluster
prod_access_token = $prod_access_token
mongo_ext_addr = $MONGO_EXT_ADDR

[hf]
HF_SPACE = cia-tools
HF_TOKEN = $HF_TOKEN
HF_BATCH_SIZE = 1000
HF_EXPORT_FORMAT = json
