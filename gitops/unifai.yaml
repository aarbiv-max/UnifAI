# Repository Secret - Must come first so ArgoCD can access the repository
apiVersion: v1
kind: Secret
metadata:
  name: unifai-gitlab-repo
  namespace: tag-ai--runtime-int
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Deploy before application
type: Opaque
stringData:
  type: git
  url: https://gitlab.cee.redhat.com/ai_tools/unifai.git
  insecure: "true"
  username: oauth2  # Standard for GitLab token auth
  password: adK_tdzvTZzLCoqNyFj5  # Replace with your GitLab token
---
# ArgoCD Multi-Source Application for Complete UnifAI Platform
# This deploys all UnifAI components directly using multiple sources
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unifai-platform
  namespace: tag-ai--runtime-int  # ArgoCD namespace
  annotations:
    argocd.argoproj.io/sync-wave: "0"  # Deploy first
  labels:
    app.kubernetes.io/name: unifai-platform
    app.kubernetes.io/component: platform
    environment: tenant
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Wave 1: Storage - Deploy first
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/unifai-dataflow-shared-storage
      helm:
        valueFiles:
          - ../../values/shared-resource-values.yaml
          - ../../values/global-config.yaml
        parameters:
          - name: "global.syncWave"
            value: "1"
          - name: "fullnameOverride"
            value: "unifai-dataflow-shared-storage"
    
    # Wave 2: Core Services - Deploy in parallel
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/mongodb
      helm:
        valueFiles:
          - ../../values/mongodb-extract.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/qdrant
      helm:
        valueFiles:
          - ../../values/qdrant-extract.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/rabbitmq
      helm:
        valueFiles:
          - ../../values/rabbitmq-extract.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/docling
      helm:
        valueFiles:
          - ../../values/docling-extract.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    # Wave 3: Shared Infrastructure Configuration - Deploy after core services
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/shared-config
      helm:
        valueFiles:
          - ../../values/shared-config-extract.yaml
          - ../../values/global-config.yaml
        parameters:
          - name: "global.syncWave"
            value: "3"
    
    # Wave 4: Application Layer - Deploy after infrastructure is ready
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/dataflow/unifai-dataflow-server
      helm:
        valueFiles:
          - ../../values/dataflow-resource-values.yaml
          - ../../values/global-config.yaml
        parameters:
          - name: "global.syncWave"
            value: "4"
          - name: "image.tag"
            value: "2025.09.25.1425"
          - name: "resources.requests.cpu"
            value: "2"
          - name: "resources.requests.memory"
            value: "4Gi"
          - name: "resources.limits.memory"
            value: "8Gi"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/dataflow/unifai-dataflow-celery
      helm:
        valueFiles:
          - ../../values/dataflow-resource-values.yaml
          - ../../values/global-config.yaml
        parameters:
          - name: "global.syncWave"
            value: "4"
          - name: "image.tag"
            value: "2025.09.25.1425"
          - name: "resources.requests.cpu"
            value: "2"
          - name: "resources.requests.memory"
            value: "4Gi"
          - name: "resources.limits.memory"
            value: "8Gi"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/sso
      helm:
        valueFiles:
          - ../../values/sso-values.yaml
          - ../../values/global-config.yaml
        parameters:
          - name: "global.syncWave"
            value: "4"
          - name: "backend.image.tag"
            value: "2025.09.25.1425"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/multiagent/be
      helm:
        valueFiles:
          - ../../values/global-config.yaml
          - ../../values/multiagent-resource-values.yaml
        parameters:
          - name: "global.syncWave"
            value: "4"
          - name: "image.tag"
            value: "2025.09.25.1425"
    
              #- repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
              #targetRevision: GENIE-727/story/gitops-unifai #HEAD
              #path: helm/ui
              #helm:
              #valueFiles:
              #- ../values/ui-values.yaml
              #- ../values/global-config.yaml
              #parameters:
              #- name: "global.syncWave"
              #value: "4"
              #- name: "image.repository"
              #value: "images.paas.redhat.com/unifai/datapipelinehub/ui"
              #- name: "image.tag"
              #value: "2025.09.25.1425"
    
    # Wave 5: Application Configuration - Deploy last after all services are up
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/dataflow/unifai-dataflow-config
      helm:
        valueFiles:
          - ../../values/global-config.yaml
        parameters:
          - name: "global.syncWave"
            value: "5"
    
              #- repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
              #targetRevision: GENIE-727/story/gitops-unifai #HEAD
              #path: helm/multiagent/multiagent-config
              #helm:
              #valueFiles:
              #- ../../values/global-config.yaml
              #parameters:
              #- name: "global.syncWave"
              #value: "5"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: tag-ai--runtime-int  # Deploy to tenant namespace
  
  syncPolicy:
    automated:
      prune: false  # Don't auto-delete resources
      selfHeal: true
    syncOptions:
    - CreateNamespace=false  # Namespace already exists
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  
  ignoreDifferences:
  - group: ""
    kind: PersistentVolumeClaim
    jsonPointers:
    - /spec/resources/requests/storage  # Ignore PVC size changes
    - /metadata/finalizers  # Ignore finalizers - Kubernetes manages these automatically
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/replicas  # Ignore HPA-controlled replicas
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas  # Ignore HPA-controlled replicas
