apiVersion: v1
items:
- apiVersion: argoproj.io/v1beta1
  kind: ArgoCD
  metadata:
    finalizers:
    - argoproj.io/finalizer
    name: argocd
    namespace: tag-ai--runtime-int
  spec:
    controller:
      processors: {}
      resources:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: 250m
          memory: 1Gi
      sharding: {}
    grafana:
      enabled: false
      ingress:
        enabled: false
      route:
        enabled: false
    ha:
      enabled: false
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    initialSSHKnownHosts: {}
    monitoring:
      enabled: false
    notifications:
      enabled: false
    prometheus:
      enabled: false
      ingress:
        enabled: false
      route:
        enabled: false
    rbac:
      defaultPolicy: ""
      policy: |
        #g, system:cluster-admins, role:admin
        p, role:admin, applications, *, */*, allow
        p, role:admin, clusters, *, *, allow
        p, role:admin, repositories, *, *, allow
        p, role:admin, projects, *, *, allow
        g, argocd-admins, role:admin
        g, system:authenticated, role:admin  
      scopes: '[groups]'
    redis:
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    repo:
      env:
      - name: GIT_SSL_NO_VERIFY
        value: "true"
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 256Mi
    resourceExclusions: "- apiGroups:\n  - tekton.dev\n  clusters:\n  - '*'\n  kinds:\n
      \ - TaskRun\n  - PipelineRun        \n"
    server:
      autoscale:
        enabled: false
      grpc:
        ingress:
          enabled: false
      ingress:
        enabled: false
      insecure: true
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 125m
          memory: 128Mi
      route:
        enabled: true
      service:
        type: ""
    sso:
      dex:
        openShiftOAuth: true
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 128Mi
      provider: dex
    tls:
      ca: {}
kind: List
metadata:
  resourceVersion: ""

