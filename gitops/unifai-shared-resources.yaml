# Repository Secret - Must come first so ArgoCD can access the repository
apiVersion: v1
kind: Secret
metadata:
  name: unifai-gitlab-repo
  namespace: tag-ai--runtime-int
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Deploy before application
type: Opaque
stringData:
  type: git
  url: https://gitlab.cee.redhat.com/ai_tools/unifai.git
  insecure: "true"
  username: oauth2  # Standard for GitLab token auth
  password: adK_tdzvTZzLCoqNyFj5  # Replace with your GitLab token
---
# ArgoCD Multi-Source Application for Complete UnifAI Platform
# This deploys all shared resources directly using multiple sources
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unifai-shared-resources
  namespace: tag-ai--runtime-int  # ArgoCD namespace
  annotations:
    argocd.argoproj.io/sync-wave: "0"  # Deploy first
  labels:
    app.kubernetes.io/name: unifai-shared-resources
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: unifai-platform
    environment: tenant
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Wave 1: Storage - Deploy first
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/unifai-dataflow-shared-storage
      helm:
        valueFiles:
          - ../../values/shared-resource-values.yaml
        parameters:
          - name: "global.syncWave"
            value: "1"
    
    # Wave 2: Core Services - Deploy in parallel
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/mongodb
      helm:
        valueFiles:
          - ../../values/mongodb-extract.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/qdrant
      helm:
        valueFiles:
          - ../../values/qdrant-extract.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/rabbitmq
      helm:
        valueFiles:
          - ../../values/rabbitmq-extract.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/docling
      helm:
        valueFiles:
          - ../../values/docling-extract.yaml
        parameters:
          - name: "global.syncWave"
            value: "2"
    
    # Wave 3: Configuration - Deploy last
    - repoURL: https://gitlab.cee.redhat.com/ai_tools/unifai.git
      targetRevision: GENIE-727/story/gitops-unifai #HEAD
      path: helm/shared-resources/shared-config
      helm:
        valueFiles:
          - ../../values/global-config.yaml
        parameters:
          - name: "global.syncWave"
            value: "3"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: tag-ai--runtime-int  # Deploy to tenant namespace
  
  syncPolicy:
    automated:
      prune: false  # Don't auto-delete shared resources
      selfHeal: true
    syncOptions:
    - CreateNamespace=false  # Namespace already exists
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  
  ignoreDifferences:
  - group: ""
    kind: PersistentVolumeClaim
    jsonPointers:
    - /spec/resources/requests/storage  # Ignore PVC size changes
    - /metadata/finalizers  # Ignore finalizers - Kubernetes manages these automatically
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/replicas  # Ignore HPA-controlled replicas
