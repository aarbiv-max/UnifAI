apiVersion: v1
kind: Pod
metadata:
  name: redis
  labels:
    app: {{ .Values.global.app}}
  namespace: {{ .Values.global.namespace }}
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: redis
      image: 'redis:latest'
      imagePullPolicy: Always
      stdin: true
      tty: true
      command: ["/bin/bash"]
      resources:
        limits:
          cpu: '4'
          memory: '32Gi'
        requests:
          cpu: '4'
          memory: '16Gi'
      # ports:
      #   - containerPort: 8080
      # securityContext:
      #   allowPrivilegeEscalation: false
      #   capabilities:
      #     drop:
      #       - ALL
